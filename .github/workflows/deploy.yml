name: deploy

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Jupyter
        run: |
          python -m pip install --upgrade pip
          python -m pip install jupyter nbconvert

          # Find where Python installs executable scripts
          JUPYTER_BIN=$(python -c "import sysconfig; print(sysconfig.get_path('scripts'))")

          echo "Jupyter executable directory: $JUPYTER_BIN"
          echo "$JUPYTER_BIN" >> $GITHUB_PATH
          export PATH="$JUPYTER_BIN:$PATH"

          # Verify installation
          which jupyter
          jupyter --version
          jupyter nbconvert --version

      - name: Verify build environment
        run: |
          echo "Python:"
          python --version

          echo "Jupyter:"
          command -v jupyter
          jupyter --version

          echo "Ruby:"
          ruby --version

          echo "Bundler:"
          bundle --version

      - name: Build Jekyll
        run: |
          export JEKYLL_ENV=production
          bundle exec jekyll build --trace

      - name: Deploy
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site